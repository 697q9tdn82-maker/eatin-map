# エリアページの「店舗リストの作り置き」を毎日少しずつ自動で更新する
# （1回あたり最大50回の検索。各エリアは約2週間ごとに新しくなる）
# （data/area-stores.json を更新して保存 → Vercelが自動で再デプロイ）
name: エリア店舗リストの更新

on:
  schedule:
    # 毎日 日本時間 18:00（Googleの1日の上限がリセットされた後）
    - cron: "0 9 * * *"
  workflow_dispatch: {} # GitHubの画面から手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 店舗リストを取得
        run: node scripts/update-area-stores.mjs
      - name: 変更があれば保存
        run: |
          if git diff --quiet data/area-stores.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/area-stores.json
          git commit -m "エリア店舗リストを自動更新"
          git push
